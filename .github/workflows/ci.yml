# Host build + tests on every PR and push to main. CUDA, Jetson and Iceoryx2 backends need
# hardware or extra toolchains and stay verified by hand (docs/hardware-verification.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ \
            python3-dev pybind11-dev python3-pytest python3-numpy
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAXON_BUILD_PYTHON=ON
      - name: Build
        run: cmake --build build
      - name: ctest
        run: ctest --test-dir build --output-on-failure
      - name: pytest
        run: PYTHONPATH=$PWD/build/python python3 -m pytest -q python/tests
